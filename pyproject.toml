[project]
name = "pageindex-rag-bench"
version = "0.1.0"
description = "Retrieval evaluation harness comparing PageIndex's vectorless tree retrieval against a pgvector baseline, with cost and latency."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Syed Tashfin" }]
keywords = ["rag", "retrieval", "evaluation", "benchmark", "pageindex", "pgvector", "ollama"]

dependencies = [
    "pageindex>=0.2.10",
    "litellm>=1.97.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    # imported directly by the baseline adapter for per-page text extraction;
    # pinned explicitly rather than relied on transitively via pageindex
    "pypdfium2>=5",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pi-bench = "bench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench", "corpus"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
